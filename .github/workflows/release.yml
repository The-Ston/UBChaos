name: Release

# Pushing a vX.Y.Z tag deploys to Cloudflare and publishes a GitHub release.
# The item groups bot calls it directly: tags it pushes do not trigger workflows.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history: the build number is the commit count.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi

      - run: npm run check

      # Roll rules, room rules and browser flows; nothing is deployed if they fail.
      - name: Test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var "BUILD_NUMBER:$(git rev-list --count HEAD)" \
            --var "COMMIT_SHA:$(git rev-parse --short HEAD)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes are the changelog section of this version.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
