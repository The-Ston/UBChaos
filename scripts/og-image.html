<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    position: relative;
    width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(circle at 30% 20%, #16202d 0%, #0a0e14 65%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6e2d6;
    display: grid; place-items: center;
  }
  /* Static artwork (smoke and light strands), drawn for this 1200x630 layout. */
  .smoke { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .frame {
    position: relative;
    width: 1100px; height: 530px; border: 2px solid #c8aa6e; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    box-shadow: inset 0 0 120px rgba(200, 170, 110, 0.1);
  }
  .brand { display: flex; align-items: center; gap: 36px; }
  .mark { width: 230px; height: 230px; filter: drop-shadow(0 4px 18px rgba(5, 8, 12, 0.85)); }
  .logo {
    font-size: 128px; font-weight: 800; letter-spacing: 0.04em; color: #f0e6d2; line-height: 1;
    text-shadow: 0 4px 28px rgba(5, 8, 12, 0.9);
  }
  .logo span { color: #c8aa6e; }
  .tagline {
    font-size: 44px; line-height: 1.1; color: #c8aa6e; font-weight: 600; letter-spacing: 1px;
    text-shadow: 0 2px 16px rgba(5, 8, 12, 0.9);
  }
  .chips { display: flex; gap: 18px; }
  .chip {
    font-size: 30px; line-height: 1.3; padding: 8px 26px; border: 2px solid #2a3a4d; border-radius: 999px;
    color: #b4bdca; background: rgba(10, 14, 20, 0.72);
  }
</style>
</head>
<body>
  <img class="smoke" src="og-smoke.svg" alt="">
  <div class="frame">
    <div class="brand">
      <img class="mark" src="../public/logo.svg" alt="">
      <div class="logo">UB<span>Chaos</span></div>
    </div>
    <div class="tagline">Ultimate Bravery entre amis</div>
    <div class="chips"><span class="chip">Normal</span><span class="chip">ARAM</span><span class="chip">ARAM du Chaos</span></div>
  </div>
  <script>
    // ?chips=A|B|C replaces the default chips (room images).
    const chips = new URLSearchParams(location.search).get("chips");
    if (chips) {
      document.querySelector(".chips").replaceChildren(
        ...chips.split("|").map((text) => Object.assign(document.createElement("span"), { className: "chip", textContent: text })),
      );
    }
  </script>
</body>
</html>
